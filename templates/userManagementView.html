<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
</head>
<body>
<h1>User Management</h1>
<hr>

<form method="post" action="{% url 'user-management' %}">
    {% csrf_token %}
    <p>Username: <input type="text" name="username"></p>
    <p>Password: <input type="password" name="password"></p>
    <p>Account Type: <input type="text" name="account_type"></p>
    <input type="submit" value="Create User">
</form>

{% if message %}
<p>{{ message }}</p>
{% endif %}

<h2>Users</h2>
<ul>
{% for user in users %}
    <li>{{ user.username }} - {{ user.accountType }}</li>
{% empty %}
    <li>No users found.</li>
{% endfor %}
</ul>
</body>
</html>
